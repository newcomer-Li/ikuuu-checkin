name: Ikuuu Checkin

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 0 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: ikuuu-checkin
  cancel-in-progress: true

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RUN_TZ: ${{ vars.RUN_TZ || 'Asia/Shanghai' }}
      RUN_AT: ${{ vars.RUN_AT || '08:15' }}
      RUN_WINDOW_MINUTES: ${{ vars.RUN_WINDOW_MINUTES || '10' }}
      RETRY: ${{ vars.RETRY || '2' }}
      RETRY_DELAY: ${{ vars.RETRY_DELAY || '2' }}
      CONNECT_TIMEOUT: ${{ vars.CONNECT_TIMEOUT || '10' }}
      MAX_TIME: ${{ vars.MAX_TIME || '30' }}
      IKUUU_BASE_URL: ${{ vars.IKUUU_BASE_URL || 'https://ikuuu.de' }}
    steps:
      - name: Prepare time and window
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          RUN_TZ="${RUN_TZ:-Asia/Shanghai}"
          RUN_AT="${RUN_AT:-08:15}"
          RUN_WINDOW_MINUTES="${RUN_WINDOW_MINUTES:-10}"
          TODAY=$(TZ="$RUN_TZ" date +%F)
          NOW=$(TZ="$RUN_TZ" date +%H:%M)
          echo "tz=$RUN_TZ" >> "$GITHUB_OUTPUT"
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          echo "now=$NOW" >> "$GITHUB_OUTPUT"
          echo "run_at=$RUN_AT" >> "$GITHUB_OUTPUT"
          echo "window=$RUN_WINDOW_MINUTES" >> "$GITHUB_OUTPUT"

      - name: Restore daily cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .ikuuu-cache/stamp
          key: ikuuu-checkin-${{ steps.prep.outputs.tz }}-${{ steps.prep.outputs.today }}

      - name: Decide to run
        id: decision
        shell: bash
        env:
          NOW: ${{ steps.prep.outputs.now }}
          RUN_AT: ${{ steps.prep.outputs.run_at }}
          WINDOW: ${{ steps.prep.outputs.window }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "should_run=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$CACHE_HIT" = "true" ]; then
            echo "should_run=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          to_min(){ IFS=: read -r h m <<<"$1"; echo $((10#$h*60 + 10#$m)); }
          diff=$(( $(to_min "$NOW") - $(to_min "$RUN_AT") )); [ $diff -lt 0 ] && diff=$((-diff))
          alt=$((1440 - diff)); [ $alt -lt $diff ] && diff=$alt
          if [ "$diff" -le "$WINDOW" ]; then echo "should_run=yes" >> "$GITHUB_OUTPUT"; else echo "should_run=no" >> "$GITHUB_OUTPUT"; fi

      - name: Write summary when skipped
        if: ${{ steps.decision.outputs.should_run != 'yes' }}
        shell: bash
        env:
          TZ_LOCAL: ${{ steps.prep.outputs.tz }}
          TODAY: ${{ steps.prep.outputs.today }}
          NOW: ${{ steps.prep.outputs.now }}
          RUN_AT: ${{ steps.prep.outputs.run_at }}
          WINDOW: ${{ steps.prep.outputs.window }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "${CACHE_HIT}" = "true" ]; then
            REASON="skipped (cache-hit: already executed today)"
          else
            REASON="skipped (outside window: now=${NOW}, target=${RUN_AT} ±${WINDOW}min)"
          fi
          {
            echo "# Ikuuu Checkin"
            echo "- status: ${REASON}"
            echo "- tz: ${TZ_LOCAL}"
            echo "- today: ${TODAY}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run checkin
        if: ${{ steps.decision.outputs.should_run == 'yes' }}
        id: run
        shell: bash
        env:
          IKUUU_COOKIES: ${{ secrets.IKUUU_COOKIES }}
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
          IKUUU_BASE_URL: ${{ vars.IKUUU_BASE_URL }}
          RETRY: ${{ vars.RETRY }}
          RETRY_DELAY: ${{ vars.RETRY_DELAY }}
          CONNECT_TIMEOUT: ${{ vars.CONNECT_TIMEOUT }}
          MAX_TIME: ${{ vars.MAX_TIME }}
        run: |
          set -euo pipefail
          RETRY="${RETRY:-2}"; RETRY_DELAY="${RETRY_DELAY:-2}"; CONNECT_TIMEOUT="${CONNECT_TIMEOUT:-10}"; MAX_TIME="${MAX_TIME:-30}"
          BASE="${IKUUU_BASE_URL:-https://ikuuu.de}"; BASE="${BASE%/}"
          if [ -n "${IKUUU_COOKIES:-}" ]; then COOKIES=$(printf '%s\n' "$IKUUU_COOKIES");
          elif [ -n "${IKUUU_COOKIE:-}" ]; then COOKIES=$(printf '%s\n' "$IKUUU_COOKIE");
          else echo "overall_status=failed" >> "$GITHUB_OUTPUT"; echo "summary=No cookie configured" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ -n "${IKUUU_COOKIE:-}" ] && echo "::add-mask::${IKUUU_COOKIE}"
          [ -n "${IKUUU_COOKIES:-}" ] && echo "::add-mask::${IKUUU_COOKIES}"
          normalized=$(printf '%s\n' "$COOKIES" \
            | tr -d '\r' \
            | awk 'BEGIN{RS=""; ORS="\n"} {gsub(/\n+/, " "); gsub(/[ \t]+/, " "); print}')
          mapfile -t COOKIE_LINES < <(printf '%s\n' "$normalized" | sed '/^[[:space:]]*$/d')
          OK=0; FAIL=0; DETAILS=()
          sanitize_msg() {
            local in="$1" out
            out=$(printf '%s' "$in" | sed -E \
              -e 's/[A-Za-z0-9._%+-]+%40[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***%40***/g' \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g' \
              -e 's/([0-9]{1,3}\.){3}[0-9]{1,3}/***.***.***.***/g' \
              -e 's/[A-Fa-f0-9]{32,}/[MASKED_HEX]/g' \
              -e 's/uid=[0-9]+/uid=****/g' \
              -e 's/key=[^ ;]+/key=****/g' \
              -e 's/ip=[^ ;]+/ip=****/g' \
              -e 's/expire_in=[0-9]+/expire_in=****/g')
            printf '%s' "$out"
          }
          check_one() {
            local ck="$1" idx="$2" http='' curl_code=0 RESP MSG RET tmpf
            tmpf=$(mktemp)
            set +e
            http=$(curl -sS "${BASE}/user/checkin" \
              -X POST \
              -H 'accept: application/json, text/javascript, */*; q=0.01' \
              -H 'x-requested-with: XMLHttpRequest' \
              -H "origin: ${BASE}" \
              -H "referer: ${BASE}/user" \
              -H 'user-agent: Mozilla/5.0' \
              --connect-timeout "$CONNECT_TIMEOUT" --max-time "$MAX_TIME" \
              --retry "$RETRY" --retry-delay "$RETRY_DELAY" --retry-all-errors \
              -b "$ck" -o "$tmpf" -w '%{http_code}')
            curl_code=$?
            set -e
            RESP=$(cat "$tmpf" 2>/dev/null || printf '{}')
            rm -f "$tmpf"
            RET=$(python3 -c 'import json,sys; s=sys.stdin.read(); print(json.loads(s).get("ret",0) if s.strip().startswith("{") else 0)' <<<"$RESP")
            MSG=$(python3 -c 'import json,sys,re; s=sys.stdin.read(); isj=s.strip().startswith("{"); msg=str(json.loads(s).get("msg","")) if isj else re.sub(r"\s+"," ",s).strip()[:120]; print(msg.replace("\n"," ").strip())' <<<"$RESP")
            MSG=$(sanitize_msg "$MSG")
            local is_success=0
            local failure_reason=""
            if [ "$http" != "200" ]; then
              failure_reason="HTTP ${http}"
            elif [ "$curl_code" -ne 0 ]; then
              failure_reason="curl_code=${curl_code}"
            elif printf '%s' "$MSG" | grep -Eiq '登录|login|失效|过期|expired|invalid|unauthorized|token|认证|auth'; then
              failure_reason="Cookie可能失效: ${MSG}"
            elif [ -z "$MSG" ] || [ "$MSG" = "{}" ]; then
              failure_reason="空响应或无效响应"
            elif [ "$RET" = "1" ] && printf '%s' "$MSG" | grep -Eq 'MB|GB|流量|traffic'; then
              is_success=1
            elif printf '%s' "$MSG" | grep -Eq '已签到|已经签到|似乎已经签到|checked.*today'; then
              is_success=1
            elif [ "$RET" != "1" ]; then
              failure_reason="ret=${RET}, 未获得流量"
            else
              failure_reason="返回ret=1但无流量信息，疑似Cookie失效"
            fi
            if [ "$is_success" -eq 1 ]; then
              OK=$((OK+1)); DETAILS+=("[#${idx}] OK ${MSG}")
            else
              FAIL=$((FAIL+1))
              if [ -n "$failure_reason" ]; then
                DETAILS+=("[#${idx}] FAIL ${failure_reason}")
              else
                DETAILS+=("[#${idx}] FAIL ret=${RET} http=${http} curl=${curl_code} ${MSG}")
              fi
            fi
          }
          i=0; for ck in "${COOKIE_LINES[@]}"; do i=$((i+1)); check_one "$ck" "$i"; done
          TOTAL=$((OK+FAIL));
          if [ "$TOTAL" -eq 0 ]; then STATUS=failed; SUMMARY="No valid cookie"; elif [ "$FAIL" -gt 0 ]; then STATUS=failed; SUMMARY="${OK} ok, ${FAIL} fail"; else STATUS=success; SUMMARY="All ${OK} accounts success"; fi
          echo "overall_status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          {
            echo "# Ikuuu Checkin"
            echo "- status: $STATUS"
            echo "- ok: $OK"
            echo "- fail: $FAIL"
            echo
            echo "| # | result | message |"
            echo "|---:|:---:|:---|"
            idx=0
            for d in "${DETAILS[@]}"; do idx=$((idx+1)); r=$(printf '%s' "$d" | awk '{print $2}'); m=$(printf '%s' "$d" | cut -d' ' -f3-); echo "| $idx | $r | $m |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark failure
        if: ${{ steps.decision.outputs.should_run == 'yes' && steps.run.outputs.overall_status != 'success' }}
        run: exit 1

      # ===== 通知步骤：无论成功失败都执行 =====
      - name: Send notifications (always)
        if: ${{ steps.decision.outputs.should_run == 'yes' }}
        shell: bash
        env:
          SUMMARY: ${{ steps.run.outputs.summary }}
          OVERALL_STATUS: ${{ steps.run.outputs.overall_status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          set -euo pipefail

          # 根据结果决定标题
          if [ "${OVERALL_STATUS}" = "success" ]; then
            MSG_TITLE="✅ Ikuuu 签到成功"
          else
            MSG_TITLE="❌ Ikuuu 签到失败"
          fi
          MSG_BODY=$(printf '%s\n\n状态: %s\n运行链接：%s' "${SUMMARY}" "${OVERALL_STATUS}" "${RUN_URL}")

          sent_any=0

          # Telegram
          if [ -n "${TG_BOT_TOKEN:-}" ] && [ -n "${TG_CHAT_ID:-}" ]; then
            payload=$(python3 -c "import json,os;print(json.dumps({'chat_id':os.environ.get('TG_CHAT_ID',''),'text':os.environ.get('MSG_TITLE','')+'\\n'+os.environ.get('MSG_BODY',''),'disable_web_page_preview':True}))")
            curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data-raw "$payload" || true
            sent_any=1
          fi

          # Feishu
          if [ -n "${FEISHU_WEBHOOK:-}" ]; then
            payload=$(python3 -c "import json,os;print(json.dumps({'msg_type':'text','content':{'text':os.environ.get('MSG_TITLE','')+'\\n'+os.environ.get('MSG_BODY','')}}))")
            curl -sS -X POST "$FEISHU_WEBHOOK" -H 'Content-Type: application/json' --data-raw "$payload" || true
            sent_any=1
          fi

          # WeCom
          if [ -n "${WECHAT_WEBHOOK:-}" ]; then
            payload=$(python3 -c "import json,os;print(json.dumps({'msgtype':'text','text':{'content':os.environ.get('MSG_TITLE','')+'\\n'+os.environ.get('MSG_BODY','')}}))")
            curl -sS -X POST "$WECHAT_WEBHOOK" -H 'Content-Type: application/json' --data-raw "$payload" || true
            sent_any=1
          fi

          # Discord
          if [ -n "${DISCORD_WEBHOOK:-}" ]; then
            payload=$(python3 -c "import json,os;print(json.dumps({'content':os.environ.get('MSG_TITLE','')+'\\n'+os.environ.get('MSG_BODY','')}))")
            curl -sS -X POST "$DISCORD_WEBHOOK" -H 'Content-Type: application/json' --data-raw "$payload" || true
            sent_any=1
          fi

          # ===== 邮件通知（无论成功失败都发送） =====
          if [ -n "${SMTP_SERVER:-}" ] && [ -n "${SMTP_USER:-}" ] && [ -n "${SMTP_PASS:-}" ] && [ -n "${MAIL_TO:-}" ]; then
            export MSG_TITLE MSG_BODY
            python3 << 'PYEOF'
import os
import smtplib
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart
from email.header import Header

smtp_server = os.environ.get("SMTP_SERVER")
smtp_port = int(os.environ.get("SMTP_PORT", "465"))
smtp_user = os.environ.get("SMTP_USER")
smtp_pass = os.environ.get("SMTP_PASS")
mail_to = os.environ.get("MAIL_TO")
subject = os.environ.get("MSG_TITLE", "Ikuuu 签到通知")
content = os.environ.get("MSG_BODY", "")

try:
    msg = MIMEMultipart()
    msg["From"] = smtp_user
    msg["To"] = mail_to
    msg["Subject"] = Header(subject, "utf-8")
    msg.attach(MIMEText(content, "plain", "utf-8"))

    if smtp_port == 465:
        server = smtplib.SMTP_SSL(smtp_server, smtp_port, timeout=30)
    else:
        server = smtplib.SMTP(smtp_server, smtp_port, timeout=30)
        server.starttls()

    server.login(smtp_user, smtp_pass)
    server.sendmail(smtp_user, mail_to.split(","), msg.as_string())
    server.quit()
    print(f"✅ 邮件已发送至: {mail_to}")
except Exception as e:
    print(f"❌ 邮件发送失败: {e}")
PYEOF
            sent_any=1
          fi

          if [ "$sent_any" -eq 0 ]; then
            echo "未配置任何通知通道（TG/飞书/企业微信/Discord/邮件）。"
          fi
